name: Security audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Re-run weekly so newly-published advisories are caught even without a push.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny (advisories, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: Check advisories, bans, sources
        run: cargo deny check advisories bans sources
