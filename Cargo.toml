[package]
name = "muri"
version = "0.11.3"
edition = "2021"
# MSRV is 1.87. The macOS/Windows/core trees build on 1.85, but the Linux SNI
# tray pulls the modern `zbus` 5 D-Bus stack (`zbus`/`zvariant`/`zbus_names`),
# which requires 1.87 — and a current, maintained D-Bus crate is the right choice
# there, so the crate's honest floor is 1.87.
rust-version = "1.87"
license = "MIT"
description = "Menu Utilities for Rust Interfaces — a cross-platform, fully-styleable tray-icon and popup-menu system (a custom-drawn muda/tray-icon replacement)."
repository = "https://github.com/MattJackson/muri"
homepage = "https://github.com/MattJackson/muri"
documentation = "https://docs.rs/muri"
readme = "README.md"
keywords = ["tray", "menu", "statusbar", "popup", "gui"]
categories = ["gui", "os::macos-apis"]
authors = ["Matthew Jackson <1085847+MattJackson@users.noreply.github.com>"]

[badges]
maintenance = { status = "actively-developed" }

# docs.rs builds on Linux by default; render the docs against macOS (the backend
# that is actually implemented) with every feature on so the full API surface —
# including the macOS tray/popup backend and the `a11y` AccessKit bridge — shows.
[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-apple-darwin"
targets = ["x86_64-apple-darwin", "x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[dependencies]
# Icon/logo PNG decode + golden-image PNG encode for the muri-owned CPU raster
# blitter (ADR-0001). muri draws the menu itself into an owned premultiplied-RGBA
# `Framebuffer` (see `src/render/raster.rs`) — no general-purpose 2D crate — so
# the only external raster dependency is this lean codec (the same one `tiny-skia`
# used internally, now direct so `tiny-skia`'s own crates drop out of the tree).
# All permissive-licensed; carries no windowing/GUI dependency, so the offscreen
# render + snapshot test runs anywhere.
png = "0.17"

# Text stack — the deep engines used *directly* (ADR-0001), with muri owning the
# thin shaping-glue + font-fallback layer in `src/render/mod.rs`:
#   * `fontdb`    — in-memory font database + CSS-like family/weight queries
#     (system-font discovery for `RasterDrawer::new`; a two-face vendored DejaVu
#     db with discovery disabled for `RasterDrawer::new_headless`).
#   * `harfrust`  — the HarfBuzz-project's Rust shaper (the actively-maintained
#     successor to the now-unmaintained `rustybuzz`, RUSTSEC-2026-0206):
#     complex-script shaping (clusters, kerning, ligatures) of a run against one
#     face. MSRV 1.85, so muri's floor is unchanged.
#   * `swash`     — glyph rasterizer: outline + color-emoji (`Content::Mask` /
#     `SubpixelMask` / `Color`) rendering, blitted onto the raster framebuffer. Also
#     supplies the cmap/metrics lookups the shaping glue needs (glyph coverage for
#     font fallback, ascent/descent for line centering).
# Together these replace `cosmic-text` (which bundled the same swash/shaper
# engines behind a non-optional `unicode-segmentation` that pinned MSRV ≥ 1.85).
fontdb = { version = "0.24", default-features = false, features = [
    "std",
    "fs",
    "memmap",
] }
harfrust = "0.13"
swash = "0.2"
# Pure-Rust AA path-fill rasterizer (already in the tree via `swash`), used by
# `src/render/svg.rs` to rasterize the restricted `Icon::Svg` subset — no
# `tiny-skia`/`resvg` and no second PNG codec (0 net-new crates).
zeno = "0.3"

# The process-global `MenuEvent` channel (spec 03 §3) — the same crate muda uses,
# for behavioral parity. Kept a NON-optional dependency (not `dep:`-gated behind
# `muda-compat`) because `MenuEvent::receiver()` is part of the *native* crate
# surface: muri emits its own events for every surface it draws, so a native
# consumer can poll the global channel without enabling the compat facade. MSRV
# stays ≤ 1.85 (crossbeam-channel's own MSRV is well below that).
crossbeam-channel = "0.5"

# Screen-reader bridge (optional, `a11y` feature). AccessKit's data model is a
# pure, portable set of node/tree types; the muri `a11y` tree maps straight onto
# it, and consumers feed the resulting `TreeUpdate` to `accesskit_macos` /
# `accesskit_windows` (which bridge to NSAccessibility / UIA).
accesskit = { version = "0.17", optional = true }

# macOS backend: the live tray icon (NSStatusItem via objc2) and the
# winit/softbuffer popup window the scene drawer paints into. Gated to macOS
# because Phase 1 only implements the macOS anchoring/popup shim.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
# Objective-C block bridge (part of the objc2 stack, already resolved via
# objc2-app-kit's default `block2` feature). The only click-away primitives
# AppKit exposes — `NSEvent`'s global/local event monitors — take a block
# handler, so native-menu-parity dismissal (#11) constructs them here.
block2 = "0.6"
# CALayer present path: build a CGImage from the raster RGBA framebuffer and set
# it as the panel content view's layer contents (replaces softbuffer).
objc2-quartz-core = "0.3"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"
# macOS AccessKit platform adapter (optional, `a11y` feature): dynamically
# subclasses the panel's content NSView so VoiceOver can walk the already-built
# `a11y` tree. 0.18 pairs with accesskit 0.17. Bridges to NSAccessibility.
#
# NOTE: accesskit_macos has never migrated off objc2 0.5 (every published
# version, incl. the latest, pins objc2 ^0.5.1 / objc2-app-kit ^0.2.0). So the
# `a11y` feature unavoidably pulls a small objc2 0.5 subtree *for the accesskit
# bridge only*. The default build carries none of it; winit's objc2 0.5 stack
# (and winit/softbuffer/raw-window-handle/accesskit_winit) are fully gone.
accesskit_macos = { version = "0.18", optional = true }

# Windows backend: the notification-area tray icon + anchor rect via
# `Shell_NotifyIcon` / `Shell_NotifyIconGetRect`. Only the tray shim is
# Windows-specific; the scene drawer and menu model are shared.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_System_LibraryLoader",
    # Required transitively: WNDCLASSW references GDI handle types (HBRUSH,
    # HCURSOR, HICON), so RegisterClassW/WNDCLASSW fail to compile without it.
    "Win32_Graphics_Gdi",
    # Global outside-click dismiss + keyboard nav into the non-activating popup
    # go through low-level `WH_MOUSE_LL` / `WH_KEYBOARD_LL` hooks, whose
    # `VIRTUAL_KEY` codes live here.
    "Win32_UI_Input_KeyboardAndMouse",
    # ACRYLIC/system-backdrop vibrancy for the popup (`DwmSetWindowAttribute`,
    # decision #6).
    "Win32_Graphics_Dwm",
    # Light/dark appearance query (`AppsUseLightTheme` under HKCU) for
    # `Platform::appearance`.
    "Win32_System_Registry",
] }
# Windows AccessKit platform adapter (optional, `a11y` feature): subclasses the
# popup/flyout `HWND` so NVDA / Narrator can walk the already-built `a11y` tree
# over UI Automation. 0.24 pairs with accesskit 0.17; it re-exports its own
# `windows`-crate `HWND`, which never crosses the `Platform` seam. Mirrors how
# `accesskit_macos` is wired on the macOS target.
#
# DEP-SKEW NOTES (#39), all confined to the optional `a11y` feature — the default
# build carries none of them:
#   * `accesskit_windows` pulls the heavy `windows` crate (not `windows-sys`) for
#     its UIA provider. muri's own Windows backend uses `windows-sys` only, so the
#     `windows` stack is present solely under `a11y`.
#   * `accesskit_macos` still pins **objc2 0.5** (^0.5.1 / objc2-app-kit ^0.2.0)
#     while muri's macOS backend is on **objc2 0.6**, so `a11y` unavoidably brings
#     a small objc2 0.5 subtree alongside 0.6 — bridged only in the a11y adapter.
#     Track upstream for an objc2 0.6 migration to collapse the two.
#   * `read-fonts`/`font-types` (transitive via the text stack) can version-skew
#     across `swash`/`fontations` bumps; pin-check on toolchain/dep updates.
accesskit_windows = { version = "0.24", optional = true }

# Linux backend (M5): the native-menu fallback (spec 22 §2, Path 1). Both crates
# are **pure Rust** — `ksni` speaks StatusNotifierItem / `com.canonical.dbusmenu`
# over `zbus`, which talks the D-Bus wire protocol directly, so the build needs
# **no** system `libdbus`/GTK (only a session bus at *runtime*). The tray icon is
# decoded to an ARGB32 pixmap with the already-shared `png` codec.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# StatusNotifierItem / AppIndicator over D-Bus. The `blocking` feature exposes the
# synchronous `ksni::blocking` API (`TrayMethods::spawn` -> `Handle`) that
# `run_tray` drives. `default-features = false` drops ksni's default `tokio`
# feature (an unused async runtime muri never touches) in favor of the lightweight
# `async-io` reactor that backs the blocking wrapper (#20).
ksni = { version = "0.3.6", default-features = false, features = [
    "blocking",
    "async-io",
] }
# Direct, pure-Rust D-Bus for the best-effort `org.freedesktop.appearance`
# color-scheme portal read (light/dark). Same major version `ksni` already uses.
zbus = { version = "5", features = ["blocking-api"] }
# X11 client for the styled, pointer-anchored `ContextMenu::open_at` path (spec 22
# §2 Path 2 / §3): an override-redirect `_NET_WM_WINDOW_TYPE_POPUP_MENU` window
# placed at the caller's absolute pointer coordinate, which X11 (unlike Wayland)
# permits a client to do. `default-features = false` selects x11rb's **pure-Rust**
# `RustConnection` — no `libxcb`/`allow-unsafe-code`, so the build needs no system
# X libraries (only a running X server, incl. XWayland, at *runtime*). MSRV is well
# below muri's 1.85 floor.
#
# Gated behind the (default-on) `x11-popup` feature so a tray-only Linux consumer
# (e.g. `default-features = false`) drops `x11rb` + `x11rb-protocol` + `gethostname`
# entirely — the SNI tray + native dbusmenu (Path 1) is the recommended default and
# needs none of it, and the tray-anchored styled popup is impossible by design
# (spec 22 §1). See spec 22 §7 item 3 (#21).
x11rb = { version = "0.13", default-features = false, optional = true }
# Wayland client stack for the styled `wlr-layer-shell` popup (feature
# `wayland-styled`, OFF by default — spec 22 §2 Path 2 Tier 1, ADR-0003). Both are
# **Linux-target-gated** (this whole table is `cfg(all(unix, not macos))`), so they
# are absent from macOS builds even under `--all-features` — the hard constraint
# that keeps the macOS gate green. `smithay-client-toolkit` with
# `default-features = false` drops its `calloop`/`xkbcommon` defaults: muri drives
# the `wayland-client` event queue directly and maps raw evdev keycodes for menu
# navigation, so no `libxkbcommon` system-library build probe is pulled — pure Rust
# except for the runtime `wl_display` socket. sctk gives the ergonomic
# `zwlr_layer_shell_v1` + `wl_shm` slot-pool wrappers; `wayland-client` is the core
# protocol + `wl_shm::Format::Argb8888`. MSRV is at/under muri's 1.87 floor.
smithay-client-toolkit = { version = "0.19", default-features = false, optional = true }
wayland-client = { version = "0.31", optional = true }
# AT-SPI2 accessibility for the self-drawn X11/Wayland popups (feature `a11y` on
# Linux — research doc §13, ADR-0003 §5). `accesskit_unix` speaks AT-SPI2 over
# D-Bus (`zbus`), display-server-agnostic and never touching the compositor, so it
# works identically under X11 and Wayland. Target-gated + optional, so the default
# build and the non-Linux `a11y` builds (which use `accesskit_macos`/`_windows`)
# carry none of it. 0.13 pairs with accesskit 0.17.
accesskit_unix = { version = "0.13", optional = true }

[features]
default = ["x11-popup"]
# Linux only: the styled, pointer-anchored `ContextMenu::open_at` popup (spec 22 §2
# Path 2), which pulls the pure-Rust `x11rb` X11 client. On by default for
# back-compat and `muda-compat` parity; a tray-only consumer can opt out with
# `default-features = false` to drop `x11rb` + `x11rb-protocol` + `gethostname` and
# keep just the SNI tray (Path 1). Inert on non-Linux targets — `x11rb` is a
# Linux-target dependency, so `dep:x11rb` is a no-op elsewhere (#21).
x11-popup = ["dep:x11rb"]
# Linux only (0.11.1): the self-drawn, styled tray/context menu on Wayland via
# `zwlr_layer_shell_v1` (wlroots compositors + KWin/Plasma). OFF by default. Gates
# the `cfg(unix, not macos)` Wayland presenter module
# (`src/platform/linux/wayland.rs`) *and* pulls the Wayland client stack
# (`smithay-client-toolkit` + `wayland-client`). Those deps live in the
# `cfg(all(unix, not(target_os = "macos")))` dependency table, so `dep:` activation
# here is a no-op on macOS/Windows — `cargo build --all-features` stays green on the
# macOS gate host because the crates are simply not present for that target (the
# hard constraint, ADR-0003). Inert on non-Linux targets (the gated module is only
# compiled under `all(unix, not(target_os = "macos"))`).
wayland-styled = ["dep:smithay-client-toolkit", "dep:wayland-client"]
# Screen-reader integration via AccessKit on the raster backend (see README).
# On macOS this activates the `accesskit_macos` platform adapter; the `dep:`
# reference to a target-specific optional dependency is inert on other targets.
# `dep:accesskit_macos` / `dep:accesskit_windows` are the per-OS platform
# adapters; each is a target-gated optional dependency, so referencing it here is
# inert on the other targets.
# `dep:accesskit_unix` is the Linux (X11/Wayland self-drawn popup) AT-SPI adapter —
# a target-gated optional dep, so referencing it here is inert on macOS/Windows.
a11y = [
    "dep:accesskit",
    "dep:accesskit_macos",
    "dep:accesskit_windows",
    "dep:accesskit_unix",
]
# The muda + tray-icon compatibility facade (`compat::muda` / `compat::tray_icon`,
# spec 02/60). It maps entirely onto muri's native model and does NOT pull in the
# real `muda` / `tray-icon` crates (locked decision #5). The global `MenuEvent`
# channel it re-exports lives in the always-compiled native surface, so this
# feature needs no `dep:` additions of its own (crossbeam-channel is unconditional
# above). Menu-bar passthrough routes through muri for 0.9.0 (divergence D3/D4).
muda-compat = []

# Embed freely-redistributable OSS UI-font substitutes for the *forced* platform
# looks (`ThemeSource::MacOs`/`Windows`/`Gnome`), so a forced foreign look can
# render in a close typeface even when the real target font isn't installed on the
# host — without ever silently drawing the wrong-OS host font (issue #54). OFF by
# default to keep the crate small: the vendored TTFs (Inter for SF Pro, Microsoft's
# own OFL Selawik for Segoe UI, genuine Cantarell for GNOME — all SIL OFL 1.1) are
# `include_bytes!`-embedded only when this is on. See `assets/fonts/README.md` for
# the substitutes, licenses, and sources. Pure cross-platform code (feature-gated,
# never `cfg(target_os)`-gated): the bundled font is registered into the forced
# theme's fontdb as a fallback tier — tried only after the real target font is
# found absent, and always before reaching for a host UI face.
bundled-fonts = []

# Speed-first release profile — a menu system's whole value is INSTANT popup open,
# so we optimize for latency, not size. This governs muri's own examples/benches;
# an embedding app sets its own profile (see the README "Performance" section for
# the recommended settings to mirror).
[profile.release]
opt-level = 3      # fastest codegen (not "s"/"z" — size-tuning hurts open latency)
lto = "fat"        # maximal cross-crate inlining across the raster/text hot path
codegen-units = 1  # best optimization
strip = true       # drop symbols (cosmetic; no runtime cost)
